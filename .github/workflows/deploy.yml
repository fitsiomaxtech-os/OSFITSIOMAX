name: Deploy to VPS

on:
  push:
    branches:
      - main
    # A push that only touches markdown cannot break the build, and proving that
    # costs a full verify run. Skipping the workflow outright -- deploy included
    # -- leaves the VPS one commit behind on a README until the next real push.
    # Nothing served at runtime reads these files, so that lag costs nothing.
    # Drop this filter if a .md ever becomes a runtime input.
    paths-ignore:
      - '**.md'

jobs:
  # Nothing in this pipeline used to look at the code before it reached the
  # server. The deploy job ran the script on the VPS and that was the whole of
  # it, so every build check anyone made was voluntary and local -- which is no
  # check at all. On 2026-08-29 a commit was one command away from shipping a
  # component that imported a module nobody had committed; the build step below
  # is what catches that class of failure.
  #
  # This runs on a GitHub-hosted runner rather than the VPS. The repo is public,
  # so they cost nothing, and a verification competing for the box it is meant
  # to be protecting is not much of a safety net.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # node_modules restored whole and keyed on the lockfile, so the install
      # below only runs when a dependency actually changed. `.cache` is carved
      # out of this entry because the next step owns that directory, and two
      # cache entries writing the same path race with one silently winning.
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            frontend/node_modules
            !frontend/node_modules/.cache
          key: node-modules-${{ runner.os }}-node20-${{ hashFiles('frontend/package-lock.json') }}

      # `npm ci`, not `npm install`. The comment that used to sit here said
      # package-lock.json was untracked and so `ci` could not run -- that stopped
      # being true three minutes after it was written, when the lockfile landed
      # in 882c5ef. `ci` installs the lockfile rather than re-resolving ranges,
      # so what this job verifies is what the lockfile pins.
      #
      # --legacy-peer-deps stays. The tree declares date-fns ^4.1.0 while
      # react-day-picker 8.10.1 peer-requires ^2.28.0 || ^3.0.0, so npm refuses
      # with ERESOLVE without it. The two have coexisted in every working install
      # here -- 4.4.0 alongside 8.10.1. The real fix is to reconcile those two
      # versions; until someone does, dropping this flag breaks every run.
      - name: Install frontend dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci --no-audit --no-fund --legacy-peer-deps

      # The build was ~55s of the ~85s this job took, nearly all of it webpack
      # recompiling modules that had not changed. CRA 5 already writes a
      # filesystem cache to node_modules/.cache -- react-scripts' webpack.config
      # sets cache.type to 'filesystem' -- it just had nowhere to persist between
      # runs. Restored AFTER the install, because `npm ci` deletes node_modules
      # wholesale and would take the cache down with it.
      #
      # The key carries the sha so each run writes a fresh entry; the fallbacks
      # take the newest entry built against the same lockfile.
      - name: Restore webpack build cache
        uses: actions/cache@v4
        with:
          path: frontend/node_modules/.cache
          key: webpack-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            webpack-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
            webpack-${{ runner.os }}-

      # CI is forced false because create-react-app promotes warnings to errors
      # when it is set, and this tree carries pre-existing exhaustive-deps
      # warnings in BranchReviewPanel, ClientHistoryModal, NetCashflowSunburst
      # and CRMPage. The gate is here to catch what does not compile, not to
      # fail a deploy on lint that was already on main before it existed.
      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: false

      # Python syntax only -- a half-saved router, which is a state this repo
      # reaches whenever more than one session is writing to it. It does NOT
      # check imports or anything at runtime. Note which step catches what: a
      # JavaScript import of a module nobody committed fails in the build step
      # above, not here.
      - name: Compile backend
        run: python3 -m compileall -q backend

  # Gated. The VPS is only touched once the tree above has been shown to build.
  deploy:
    needs: verify
    runs-on: [self-hosted, osfitsiomax-vps]
    steps:
      - name: Deploy to VPS
        run: bash /root/deploy-osfitsiomax.sh
